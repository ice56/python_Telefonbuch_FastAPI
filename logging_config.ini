[loggers] # zeile 9
keys=root

[handlers]  # zeile 15
keys=fileHandler

[formatters] # zeile 12
keys=simpleFormatter

[logger_root] # zeile 10
level=INFO
handlers=fileHandler

[handler_fileHandler]   # zeile 16
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('%(LOG_DIR)s/telefonbuch.log', 'a')

[formatter_simpleFormatter] # zeile 13
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

